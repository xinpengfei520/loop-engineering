name: Loop Daily

# Durable replacement for the session-only crons that kept expiring after 7 days
# (see STATE.md H-2 / H-3 / H-4 / H-5 and W-E). This runs on GitHub's schedulers,
# so it cannot silently die with a local Claude session.
#
# Layer 1 — `heartbeat`: deterministic checks, no secrets required. Always runs.
# Layer 2 — `claude-triage`: full Claude-driven triage. Skipped unless the
#           ANTHROPIC_API_KEY repo secret exists.
#
# Cron is UTC. 02:03 UTC == 10:03 Asia/Shanghai, matching the old triage slot.
# Note: GitHub may delay scheduled runs during peak load; exact minute is not guaranteed.

on:
  schedule:
    - cron: '3 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    name: Deterministic health + freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for STATE.md last-commit date

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Freshness checks
        id: fresh
        run: |
          set -euo pipefail
          findings=""

          # (1) STATE.md staleness > 7d, measured from its last commit.
          state_ts=$(git log -1 --format=%ct -- STATE.md)
          state_age=$(( ( $(date +%s) - state_ts ) / 86400 ))
          echo "STATE.md last updated ${state_age}d ago"
          if [ "$state_age" -gt 7 ]; then
            findings="${findings}- STATE.md is stale: last updated ${state_age}d ago (>7d).\n"
          fi

          # (3) Oldest real run-log entry > 30d.
          # Only look below the append marker — the header holds a format EXAMPLE
          # with an old run_id that must not be mistaken for a real run
          # (documented in STATE.md "Recent Noise" as the run-log grep trap).
          oldest=$(sed -n '/Loop appends below this line/,$p' loop-run-log.md \
            | grep -oE '"run_id": "[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          if [ -n "$oldest" ]; then
            oldest_age=$(( ( $(date +%s) - $(date -d "$oldest" +%s) ) / 86400 ))
            echo "Oldest real run-log entry: ${oldest} (${oldest_age}d)"
            if [ "$oldest_age" -gt 30 ]; then
              findings="${findings}- Run-log has entries older than 30d (oldest ${oldest}, ${oldest_age}d) — prune per its header.\n"
            fi
          fi

          # (4) Open (un-struck) High-Priority items.
          open_high=$(grep -nE '^### H-[0-9]' STATE.md | grep -v '~~' || true)
          if [ -n "$open_high" ]; then
            echo "Open High items:"; echo "$open_high"
            findings="${findings}- STATE.md has open High-Priority item(s) awaiting a human decision:\n\`\`\`\n${open_high}\n\`\`\`\n"
          fi

          if [ -n "$findings" ]; then
            {
              echo "findings<<EOF"
              printf '%b' "$findings"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report findings to an issue
        if: steps.fresh.outputs.findings != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.fresh.outputs.findings }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Loop heartbeat: attention needed"
          body=$(printf '%s\n\n%s\n\n[Workflow run](%s)\n' \
            "The scheduled loop heartbeat found items needing attention:" "$FINDINGS" "$RUN_URL")

          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Gate: `secrets` cannot be referenced in a job-level `if`, so surface
  # presence/absence as an output first.
  check-key:
    name: Check for ANTHROPIC_API_KEY
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.c.outputs.present }}
    steps:
      - id: c
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not set — skipping Claude triage (heartbeat still runs)."
          fi

  claude-triage:
    name: Claude triage (optional)
    needs: check-key
    if: needs.check-key.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the Daily Triage loop (pattern: daily-triage, L1 report-only).
            First invoke the loop-constraints skill (load loop-constraints.md, honor
            loop-pause-all), then loop-budget, then the loop-triage skill.
            Read README, package.json, structure, recent git diff, STATE.md, and LOOP.md;
            summarize the 3-5 most important issues.

            This run is NON-INTERACTIVE and has no human to answer questions, so:
            - Do NOT edit files, commit, push, or delete anything.
            - Report your findings as your final message instead of writing to STATE.md.
            - Anything needing a decision goes under High Priority as
              "需要人工确认 / needs human confirmation".
